envVarGroups:
  - name: questchog-secrets
    envVars:
      # Generated by Render: base64 256-bit values.
      - key: DB_ENC_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: NIGHT_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # Entered in the dashboard on first deploy. Never committed.
      # Must equal the CRON_SECRET the Neon scheduler function was deployed with.
      - key: CRON_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: NEXT_PUBLIC_TELEGRAM_BOT_USERNAME
        sync: false
      - key: VOUCHER_SIGNER_PRIVATE_KEY
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      # Neon pooled connection string (the direct one for migrations is derived from it).
      - key: DATABASE_URL
        sync: false
      - key: NEON_AI_GATEWAY_BASE_URL
        sync: false
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false

services:
  - type: web
    name: questchog
    runtime: node
    # Same AWS region as the Neon project (aws-us-east-2, Ohio).
    region: ohio
    plan: starter
    # One instance only: the relayer orders its nonces in-process.
    numInstances: 1
    buildCommand: npm install -g bun@1.3.10 && bun install --frozen-lockfile && bun run build
    # Migrates Neon over DATABASE_URL_UNPOOLED (drizzle.config.ts).
    preDeployCommand: npx drizzle-kit migrate
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - fromGroup: questchog-secrets
