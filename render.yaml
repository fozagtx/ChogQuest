databases:
  - name: questchog-db
    databaseName: questchog
    region: oregon
    plan: basic-256mb

envVarGroups:
  - name: questchog-secrets
    envVars:
      # Generated by Render: base64 256-bit values.
      - key: DB_ENC_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: NIGHT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # Entered in the dashboard on first deploy. Never committed.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: NEXT_PUBLIC_TELEGRAM_BOT_USERNAME
        sync: false
      - key: VOUCHER_SIGNER_PRIVATE_KEY
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: CHOG_NFT_ADDRESS
        sync: false
      - key: CHRONICLE_ADDRESS
        value: "0xb46cd62a826b94f07a507c5359f79f189200ec93"
      - key: MONAD_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: CHOG_RPC_URL
        sync: false
      - key: APP_URL
        sync: false

services:
  - type: web
    name: questchog
    runtime: node
    region: oregon
    plan: starter
    # One instance only: the relayer orders its nonces in-process.
    numInstances: 1
    buildCommand: npm install -g bun@1.3.10 && bun install --frozen-lockfile && bun run build
    preDeployCommand: npx drizzle-kit migrate
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: questchog-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - fromGroup: questchog-secrets

  - type: cron
    name: questchog-morning
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 7 * * *"
    buildCommand: echo "no build"
    startCommand: 'curl -fsS -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/cron/morning"'
    envVars:
      - fromGroup: questchog-secrets

  - type: cron
    name: questchog-evening
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 19 * * *"
    buildCommand: echo "no build"
    startCommand: 'curl -fsS -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/cron/evening"'
    envVars:
      - fromGroup: questchog-secrets
